name: Question
description: Ask about setup, configuration, or integration.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the [README](https://github.com/aalampatil/oidc#readme) and [integration guide](https://github.com/aalampatil/oidc/blob/main/docs/oidc-integration.md). Report suspected vulnerabilities privately using [the security policy](https://github.com/aalampatil/oidc/blob/main/SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Explain what you are trying to do and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include the documentation you followed and any sanitized errors.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and context
      description: Include the commit, OS, Bun version, browser/version, and local or deployed setup as relevant. Do not include credentials, tokens, private signing keys, personal data, or complete .env files.
